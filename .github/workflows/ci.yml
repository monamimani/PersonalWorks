name: ci

on:
  workflow_dispatch:
#    inputs:
#      tmate_enabled:
#        type: boolean
#        description: 'Run the build with tmate debugging enabled (https://github.com/marketplace/actions/debugging-with-tmate)'
#        required: false
#        default: false
  pull_request:
  release:
    types: [published]
  push:
    branches:
      - '**'

permissions:
  packages: write
  contents: read

jobs:

  build-test-windows:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: windows-2025-vs2026
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            configure-preset: "Windows-Msvc-Ninja-Debug"
            build-preset: "Windows-Msvc-Ninja-Debug"
          - os: windows-latest
            configure-preset: "Windows-Msvc-Ninja-Release"
            build-preset: "Windows-Msvc-Ninja-Release"
          - os: windows-latest
            configure-preset: "Windows-Msvc-NinjaMultiConfig"
            build-preset: "Windows-Msvc-NinjaMultiConfig-Debug"
          - os: windows-latest
            configure-preset: "Windows-Msvc-VisualStudio"
            build-preset: "Windows-Msvc-VisualStudio-Debug"

    name: ${{matrix.build-preset}}
    steps:
      - uses: actions/checkout@v4

#      - name: Setup tmate session
#        uses: mxschmitt/action-tmate/detached@v3
#        if: ${{ github.event_name == 'workflow_dispatch' && inputs.tmate_enabled }}
#        with:
#          sudo: false

      - uses: actions/checkout@v6

      - name: Env variable
        shell: bash
        run: |
          printenv
          # echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> $GITHUB_ENV

      - name: Set ownership
        shell: bash
        run: |
          # this is to fix GIT not liking owner of the checkout dir
          #chown -R $(id -u):$(id -g) $PWD
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Vcpkg Cache
        uses: ./.github/actions/vcpkg_cache
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: CPM Cache
        id: cache-cpm
        uses: actions/cache@v5
        with:
          path: _Out/cpm_sources
          key: ${{ runner.os }}-cpm-${{ hashFiles('_Out/cpm_sources/**/') }}
          restore-keys: |
            ${{ runner.os }}-cpm-

      - name: Install Visual Studio Components
        shell: pwsh
        run: |
          $installerPath = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vs_installer.exe"
          $vswhere = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe"

          if (-not (Test-Path $installerPath) -or -not (Test-Path $vswhere)) {
              Write-Error "Could not find vs_installer.exe or vswhere.exe in standard location."
              exit 1
          }

          $installPath = & $vswhere -latest -products * -property installationPath

          if (-not $installPath) {
              Write-Error "Could not locate Visual Studio installation path."
              exit 1
          }

          $componentId = "Microsoft.VisualStudio.Component.VC.Preview.Tools.x86.x64"
          Write-Host "Adding VS component: $componentId to $installPath"

          & $installerPath modify --installPath "$installPath" --add $componentId --quiet --norestart

          if ($LASTEXITCODE -eq 0 -or $LASTEXITCODE -eq 3010) {
              Write-Host "Visual Studio component installation completed successfully (Exit Code: $LASTEXITCODE)."
          } else {
              Write-Error "Visual Studio component installation failed with Exit Code: $LASTEXITCODE."
              $failed = $true
          }

          # Always dump the latest dd_setup log to see what the installer actually did
          $logFile = Get-ChildItem -Path $env:TEMP -Filter "dd_setup_*.log" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if ($logFile) {
              Write-Host "--- BEGIN VS INSTALLER LOG ---"
              Get-Content $logFile.FullName
              Write-Host "--- END VS INSTALLER LOG ---"
          }

          if ($failed) {
              exit 1
          }
          $msvcToolsPath = Join-Path $installPath.Trim() "VC\Tools\MSVC"
          if (Test-Path $msvcToolsPath) {
              Write-Host "Contents of $msvcToolsPath :"
              Get-ChildItem -Path $msvcToolsPath | Select-Object Name, CreationTime
          } else {
              Write-Warning "Path not found: $msvcToolsPath"
          }

      - name: "CMake Configure & Build"
        shell: pwsh
        run: |
          . Scripts\Build\VsEnvironment.ps1; InvokeVcVarsAll

          # Workaround for CMake Visual Studio Generator bug with MSVC v14.51 Preview
          if ('${{ matrix.configure-preset }}' -eq 'Windows-Msvc-VisualStudio') {
              Write-Host "Applying workaround for MSVC v14.51 Preview MSBuild properties..."

              $vcInstallDir = $env:VCINSTALLDIR
              if (-not $vcInstallDir -and $env:VCToolsInstallDir) {
                  $vcInstallDir = Resolve-Path (Join-Path $env:VCToolsInstallDir "..\..\..")
              }

              if ($vcInstallDir) {
                  $buildDir = Join-Path $vcInstallDir "Auxiliary\Build"
                  $targetDir = Join-Path $buildDir "14.51"

                  if (-not (Test-Path $targetDir)) {
                      New-Item -ItemType Directory -Path $targetDir | Out-Null
                  }

                  $srcProps = Join-Path $buildDir "v145\Microsoft.VCToolsVersion.VC.14.51.props"
                  $srcTxt = Join-Path $buildDir "v145\Microsoft.VCToolsVersion.VC.14.51.txt"

                  if (Test-Path $srcProps) {
                      Copy-Item -Path $srcProps -Destination (Join-Path $targetDir "Microsoft.VCToolsVersion.14.51.props") -Force
                  }
                  if (Test-Path $srcTxt) {
                      Copy-Item -Path $srcTxt -Destination (Join-Path $targetDir "Microsoft.VCToolsVersion.14.51.txt") -Force
                  }
              } else {
                  Write-Warning "Could not find VCINSTALLDIR or VCToolsInstallDir. Workaround skipped."
              }
          }

          cmake --preset ${{matrix.configure-preset}} -DGIT_SHA:STRING=${{ github.sha }} -DPersonalWorks_ENABLE_CLANG_TIDY=OFF
          cmake --build --preset ${{matrix.build-preset}}

      # - name: Tests
      #   run: |
      #     cmake --build --preset $CMAKE_PRESET

  build-test-linux:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.allow_failure }}
    container:
      image: 'ghcr.io/monamimani-builds/cpp-linux-devcontainer:latest'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            configure-preset: "Linux-Clang-Ninja-Debug"
            build-preset: "Linux-Clang-Ninja-Debug"
            allow_failure: false
          - os: ubuntu-latest
            configure-preset: "Linux-Clang-Ninja-Release"
            build-preset: "Linux-Clang-Ninja-Release"
            allow_failure: false
          - os: ubuntu-latest
            configure-preset: "Linux-Gcc-Ninja-Debug"
            build-preset: "Linux-Gcc-Ninja-Debug"
            allow_failure: true
          - os: ubuntu-latest
            configure-preset: "Linux-Gcc-Ninja-Release"
            build-preset: "Linux-Gcc-Ninja-Release"
            allow_failure: true
          - os: ubuntu-latest
            configure-preset: "Linux-Clang-NinjaMultiConfig"
            build-preset: "Linux-Clang-NinjaMultiConfig-Debug"
            allow_failure: false

    name: ${{matrix.build-preset}}
    steps:
    - uses: actions/checkout@v6

    - name: Env variable
      shell: bash
      run: |
        printenv
        # echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> $GITHUB_ENV

    - name: Set ownership
      shell: bash
      run: |
        # this is to fix GIT not liking owner of the checkout dir
        #chown -R $(id -u):$(id -g) $PWD
        git config --global --add safe.directory "$GITHUB_WORKSPACE"

    - name: Vcpkg Cache
      uses: ./.github/actions/vcpkg_cache
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: CPM Cache
      id: cache-cpm
      uses: actions/cache@v5
      with:
        path: _Out/cpm_sources
        key: ${{ runner.os }}-cpm-${{ hashFiles('_Out/cpm_sources/**/') }}
        restore-keys: |
          ${{ runner.os }}-cpm-

    - name: "Fetch latest vcpkg"
      if: runner.os == 'Linux'
      run: |
        cd $VCPKG_ROOT
        pwd
        git fetch

    - name: "[Linux] CMake Configure & Build"
      if: runner.os == 'Linux'
      run: |

        cmake --preset ${{matrix.configure-preset}} -DGIT_SHA:STRING=${{ github.sha }} -DPersonalWorks_ENABLE_CLANG_TIDY=OFF -DPersonalWorks_ENABLE_CPPCHECK=OFF
        cmake --build --preset ${{matrix.build-preset}}

    # - name: Tests
    #   run: |
    #     cmake --build --preset $CMAKE_PRESET
