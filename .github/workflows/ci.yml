name: ci

on:
  workflow_dispatch:
    inputs:
      tmate_enabled:
        type: boolean
        description: 'Run the build with tmate debugging enabled (https://github.com/marketplace/actions/debugging-with-tmate)'
        required: false
        default: false
  pull_request:
  release:
    types: [published]
  push:
    branches:
      - '**'

permissions:
  packages: write
  contents: read

jobs:

  build-test-windows:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: windows-2025-vs2026
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            configure-preset: "Windows-Msvc-Ninja-Debug"
            build-preset: "Windows-Msvc-Ninja-Debug"
          - os: windows-latest
            configure-preset: "Windows-Msvc-Ninja-Release"
            build-preset: "Windows-Msvc-Ninja-Release"
          - os: windows-latest
            configure-preset: "Windows-Msvc-NinjaMultiConfig"
            build-preset: "Windows-Msvc-NinjaMultiConfig-Debug"
          - os: windows-latest
            configure-preset: "Windows-Msvc-Vs2022"
            build-preset: "Windows-Msvc-Vs2022-Debug"

    name: ${{matrix.build-preset}}
    steps:
      - uses: actions/checkout@v4
      - name: Setup tmate session
        uses: mxschmitt/action-tmate/detached@v3
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.tmate_enabled }}
        with:
          sudo: false

      - uses: actions/checkout@v6

      - name: Env variable
        shell: bash
        run: |
          printenv
          # echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> $GITHUB_ENV

      - name: Set ownership
        shell: bash
        run: |
          # this is to fix GIT not liking owner of the checkout dir
          #chown -R $(id -u):$(id -g) $PWD
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Vcpkg Cache
        uses: ./.github/actions/vcpkg_cache
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Chocolatey Cache
        if: runner.os == 'Windows'
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.LOCALAPPDATA }}\Temp\chocolatey
            ${{ env.ProgramData }}\chocolatey\lib
            ${{ env.ProgramData }}\chocolatey\bin
            ${{ env.ProgramData }}\chocolatey\config
          key: ${{ runner.os }}-choco-${{ hashFiles('**/chocolatey.config') }}
          restore-keys: |
            ${{ runner.os }}-choco-

      - name: CPM Cache
        id: cache-cpm
        uses: actions/cache@v5
        with:
          path: _Out/cpm_sources
          key: ${{ runner.os }}-cpm-${{ hashFiles('_Out/cpm_sources/**/') }}
          restore-keys: |
            ${{ runner.os }}-cpm-

      - name: Install Visual Studio Build Tools
        shell: pwsh
        run: |
          Write-Host "Installing VS 2026 Build Tools..."
          choco install visualstudio2026buildtools -y --no-progress --limit-output --ignore-package-exit-codes=3010
          choco install visualstudio2026-workload-nativedesktop -y --ignore-package-exit-codes=3010
          choco install visualstudio2026-workload-vctools -y --ignore-package-exit-codes=3010 --package-parameters "--add Microsoft.VisualStudio.Component.VC.Preview.Tools.x86.x64"
          Write-Host "VS 2026 Build Tools installation completed"

      - name: "CMake Configure & Build"
        shell: pwsh
        run: |
          . Scripts\Build\VsEnvironment.ps1; InvokeVcVarsAll

          ninja --version

          cmake --preset ${{matrix.configure-preset}} -DGIT_SHA:STRING=${{ github.sha }} -DPersonalWorks_ENABLE_CLANG_TIDY=OFF
          cmake --build --preset ${{matrix.build-preset}}

      # - name: Tests
      #   run: |
      #     cmake --build --preset $CMAKE_PRESET

  build-test-linux:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.allow_failure }}
    container:
      image: 'ghcr.io/monamimani-builds/cpp-linux-devcontainer:latest'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            configure-preset: "Linux-Clang-Ninja-Debug"
            build-preset: "Linux-Clang-Ninja-Debug"
            allow_failure: false
          - os: ubuntu-latest
            configure-preset: "Linux-Clang-Ninja-Release"
            build-preset: "Linux-Clang-Ninja-Release"
            allow_failure: false
          - os: ubuntu-latest
            configure-preset: "Linux-Gcc-Ninja-Debug"
            build-preset: "Linux-Gcc-Ninja-Debug"
            allow_failure: true
          - os: ubuntu-latest
            configure-preset: "Linux-Gcc-Ninja-Release"
            build-preset: "Linux-Gcc-Ninja-Release"
            allow_failure: true
          - os: ubuntu-latest
            configure-preset: "Linux-Clang-NinjaMultiConfig"
            build-preset: "Linux-Clang-NinjaMultiConfig-Debug"
            allow_failure: false

    name: ${{matrix.build-preset}}
    steps:
    - uses: actions/checkout@v6

    - name: Env variable
      shell: bash
      run: |
        printenv
        # echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> $GITHUB_ENV

    - name: Set ownership
      shell: bash
      run: |
        # this is to fix GIT not liking owner of the checkout dir
        #chown -R $(id -u):$(id -g) $PWD
        git config --global --add safe.directory "$GITHUB_WORKSPACE"

    - name: Vcpkg Cache
      uses: ./.github/actions/vcpkg_cache
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: CPM Cache
      id: cache-cpm
      uses: actions/cache@v5
      with:
        path: _Out/cpm_sources
        key: ${{ runner.os }}-cpm-${{ hashFiles('_Out/cpm_sources/**/') }}
        restore-keys: |
          ${{ runner.os }}-cpm-

    - name: "Fetch latest vcpkg"
      if: runner.os == 'Linux'
      run: |
        cd $VCPKG_ROOT
        pwd
        git fetch

    - name: "[Linux] CMake Configure & Build"
      if: runner.os == 'Linux'
      run: |

        cmake --preset ${{matrix.configure-preset}} -DGIT_SHA:STRING=${{ github.sha }} -DPersonalWorks_ENABLE_CLANG_TIDY=OFF -DPersonalWorks_ENABLE_CPPCHECK=OFF
        cmake --build --preset ${{matrix.build-preset}}

    # - name: Tests
    #   run: |
    #     cmake --build --preset $CMAKE_PRESET
