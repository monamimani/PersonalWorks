name: ci

on:
  workflow_dispatch:
  pull_request:
  release:
    types: [published]
  push:
    branches:
      - main
      - dev

permissions:
  packages: write
  contents: read

jobs:

  build-test-windows:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: windows-2025-vs2026
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            configure-preset: "Windows-Msvc-Ninja-Debug"
            build-preset: "Windows-Msvc-Ninja-Debug"
          - os: windows-latest
            configure-preset: "Windows-Msvc-Ninja-Release"
            build-preset: "Windows-Msvc-Ninja-Release"
          - os: windows-latest
            configure-preset: "Windows-Msvc-NinjaMultiConfig"
            build-preset: "Windows-Msvc-NinjaMultiConfig-Debug"
          - os: windows-latest
            configure-preset: "Windows-Msvc-Vs2022"
            build-preset: "Windows-Msvc-Vs2022-Debug"

    name: ${{matrix.build-preset}}
    steps:
      - uses: actions/checkout@v6

      - name: Env variable
        shell: bash
        run: |
          printenv
          # echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> $GITHUB_ENV

      - name: Set ownership
        shell: bash
        run: |
          # this is to fix GIT not liking owner of the checkout dir
          #chown -R $(id -u):$(id -g) $PWD
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Vcpkg Cache
        uses: ./.github/actions/vcpkg_cache
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Chocolatey Cache
        if: runner.os == 'Windows'
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.LOCALAPPDATA }}\Temp\chocolatey
            C:\ProgramData\chocolatey\lib
            C:\ProgramData\chocolatey\bin
            C:\ProgramData\chocolatey\config
          key: ${{ runner.os }}-choco-v4
          restore-keys: |
            ${{ runner.os }}-choco-v4

      - name: CPM Cache
        id: cache-cpm
        uses: actions/cache@v5
        with:
          path: _Out/cpm_sources
          key: ${{ runner.os }}-cpm-${{ hashFiles('_Out/cpm_sources/**/') }}
          restore-keys: |
            ${{ runner.os }}-cpm-

      # - name: Setup Cache
      #   uses: ./.github/actions/setup_cache
      #   with:
      #     compiler: ${{ matrix.compiler }}
      #     build_type: ${{ matrix.build_type }}
      #     packaging_maintainer_mode: false
      #     generator: ${{ matrix.generator }}

      - name: List Installed VS Components (Pre-Install)
        shell: pwsh
        run: |
          $vswhere = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe"
          Write-Host "Checking for VS instances (including prerelease)..."
          & $vswhere -all -prerelease -products * -property installationPath
          Write-Host "Checking for VC Tools component..."
          & $vswhere -all -prerelease -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath

      - name: Install Visual Studio Build Tools
        shell: pwsh
        run: |
          Write-Host "Installing VS 2026 Build Tools..."
          
          # Use -y to accept all licenses and ignore 3010 (restart required)
          choco install visualstudio2026buildtools-preview -y --pre --no-progress --limit-output --ignore-package-exit-codes=3010
          
          Write-Host "Installing C++ Workload with latest tools..."
          # Using the generic 'latest' ID which should point to 14.51 in the preview channel
          choco install visualstudio2026-preview-workload-vctools -y --pre --no-progress --limit-output --ignore-package-exit-codes=3010 --package-parameters "--add Microsoft.VisualStudio.Component.VC.Tools.x86.x64 --includeOptional"
          
          Write-Host "VS 2026 Build Tools installation completed"

      - name: List Installed VS Components (Post-Install)
        shell: pwsh
        run: |
          $vswhere = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe"
          Write-Host "Checking for all instances..."
          & $vswhere -all -prerelease -products * -property installationPath
          Write-Host "Listing all components for all instances..."
          & $vswhere -all -prerelease -products * -format json

      - name: "CMake Configure & Build"
        run: |
          & { . Scripts\Build\VsEnvironment.ps1; LaunchVsDevShell }

          cmake --preset ${{matrix.configure-preset}} -DGIT_SHA:STRING=${{ github.sha }} -DPersonalWorks_ENABLE_CLANG_TIDY=OFF
          cmake --build --preset ${{matrix.build-preset}}

      # - name: Tests
      #   run: |
      #     cmake --build --preset $CMAKE_PRESET

  build-test-linux:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.allow_failure }}
    container:
      image: 'ghcr.io/monamimani-builds/cpp-linux-devcontainer:latest'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            configure-preset: "Linux-Clang-Ninja-Debug"
            build-preset: "Linux-Clang-Ninja-Debug"
            allow_failure: false
          - os: ubuntu-latest
            configure-preset: "Linux-Clang-Ninja-Release"
            build-preset: "Linux-Clang-Ninja-Release"
            allow_failure: false
          - os: ubuntu-latest
            configure-preset: "Linux-Gcc-Ninja-Debug"
            build-preset: "Linux-Gcc-Ninja-Debug"
            allow_failure: true
          - os: ubuntu-latest
            configure-preset: "Linux-Gcc-Ninja-Release"
            build-preset: "Linux-Gcc-Ninja-Release"
            allow_failure: true
          - os: ubuntu-latest
            configure-preset: "Linux-Clang-NinjaMultiConfig"
            build-preset: "Linux-Clang-NinjaMultiConfig-Debug"
            allow_failure: false

    name: ${{matrix.build-preset}}
    steps:
    - uses: actions/checkout@v6

    - name: Env variable
      shell: bash
      run: |
        printenv
        # echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> $GITHUB_ENV

    - name: Set ownership
      shell: bash
      run: |
        # this is to fix GIT not liking owner of the checkout dir
        #chown -R $(id -u):$(id -g) $PWD
        git config --global --add safe.directory "$GITHUB_WORKSPACE"

    - name: Vcpkg Cache
      uses: ./.github/actions/vcpkg_cache
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: CPM Cache
      id: cache-cpm
      uses: actions/cache@v5
      with:
        path: _Out/cpm_sources
        key: ${{ runner.os }}-cpm-${{ hashFiles('_Out/cpm_sources/**/') }}
        restore-keys: |
          ${{ runner.os }}-cpm-

    # - name: Setup Cache
    #   uses: ./.github/actions/setup_cache
    #   with:
    #     compiler: ${{ matrix.compiler }}
    #     build_type: ${{ matrix.build_type }}
    #     packaging_maintainer_mode: false
    #     generator: ${{ matrix.generator }}

    - name: "Fetch latest vcpkg"
      if: runner.os == 'Linux'
      run: |
        cd $VCPKG_ROOT
        pwd
        git fetch

    - name: "[Linux] CMake Configure & Build"
      if: runner.os == 'Linux'
      run: |

        cmake --preset ${{matrix.configure-preset}} -DGIT_SHA:STRING=${{ github.sha }} -DPersonalWorks_ENABLE_CLANG_TIDY=OFF -DPersonalWorks_ENABLE_CPPCHECK=OFF
        cmake --build --preset ${{matrix.build-preset}}

    # - name: Tests
    #   run: |
    #     cmake --build --preset $CMAKE_PRESET
